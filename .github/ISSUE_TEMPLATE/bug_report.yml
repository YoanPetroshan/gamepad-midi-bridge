name: Something doesn't work
description: Report a bug or a controller that is not recognised
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! English or Bulgarian (Български) is fine.
        **This issue is public.** Please don't paste personal data.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can I see it myself? (optional)
      description: The buttons you pressed, which layer, which controller.
  - type: textarea
    id: app_info
    attributes:
      label: App info
      description: Filled in automatically when you send from the app. Running `--diag` helps for controller problems.
      render: text
